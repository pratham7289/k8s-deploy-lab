name: fb-admin
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "delete | stats"
        default: stats
      args:
        description: "video ids for delete (space separated)"
        default: ""
  schedule:
    - cron: "40 17 * * *"   # 23:25 NPT: daily stats
permissions:
  contents: write
concurrency: post-reel
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main   # newest posted.json, not the (older) commit this run was queued on
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.34.2
      - name: Run
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          CMD: ${{ github.event.inputs.cmd || 'stats' }}
          ARGS: ${{ github.event.inputs.args }}
        run: |
          case "$CMD" in delete|stats) ;; *) echo "unknown cmd"; exit 1;; esac
          ARGS_CLEAN=$(printf '%s' "$ARGS" | tr -cd '0-9 ')   # video ids are digits only
          python scripts/fb_admin.py "$CMD" $ARGS_CLEAN
      - name: Save state
        run: |
          python3 scripts/save_state.py "admin $(date -u +%FT%TZ)"

name: post-reel
on:
  schedule:
    # 3 a day: 07:15, 12:45, 19:15 Nepal time (UTC+5:45) -> 01:30, 07:00, 13:30 UTC
    - cron: "30 1 * * *"
    - cron: "0 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning | politics | breaking | publicinfo | evening"
        required: false
      mode:
        description: "publish | draft | dry"
        default: "publish"
permissions:
  contents: write
concurrency: post-reel
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 >/dev/null
      - run: pip install -q -r requirements.txt
      - name: Fetch fonts (OFL) if missing
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/NotoSansDevanagari.ttf ] || curl -sSL -o assets/fonts/NotoSansDevanagari.ttf "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf"
          [ -f assets/fonts/NotoSans.ttf ] || curl -sSL -o assets/fonts/NotoSans.ttf "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf"
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLOT: ${{ github.event.inputs.slot }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: python -m pipeline.main
      - name: Save state
        run: |
          git config user.name "nepal-canvas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          [ -f token.enc ] && git add token.enc
          git rm -q --cached --ignore-unmatch token.json
          git diff --cached --quiet || (git commit -m "post: $(date -u +%FT%TZ)" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*/reel.mp4
            out/*/caption.txt
          retention-days: 7
          if-no-files-found: ignore

name: post-reel
on:
  schedule:
    # Hourly Reels 06:00-22:00 Nepal time + extra breaking Reels. Main trigger: cron-job.org at :05 (slots) and :35 (breaking check).
    # This GitHub cron is only a backup (it is often late); runs with nothing due exit in seconds.
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      when:
        description: "now = make and post one immediately | slot = prepare the next hourly slot or check for breaking news"
        default: "now"
      slot:
        description: "story type for 'now': morning | politics | breaking | publicinfo | evening"
        required: false
      mode:
        description: "publish | draft | dry"
        default: "publish"
permissions:
  contents: write
concurrency: post-reel
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main   # newest posted.json, not the (older) commit this run was queued on
      - name: Which slot is due?
        id: gate
        if: github.event_name == 'schedule' || github.event.inputs.when == 'slot'
        run: python3 -m pipeline.schedule
      - name: Decide
        id: go
        env:
          EVENT: ${{ github.event_name }}
          WHEN: ${{ github.event.inputs.when }}
          DUE: ${{ steps.gate.outputs.due }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$WHEN" != "slot" ]; then echo "run=yes" >> "$GITHUB_OUTPUT";
          elif [ "$DUE" = "yes" ]; then echo "run=yes" >> "$GITHUB_OUTPUT";
          else echo "run=no" >> "$GITHUB_OUTPUT"; echo "nothing due"; fi
      - name: Claim the slot before any work (no duplicates even if this job is killed)
        id: claim
        if: steps.go.outputs.run == 'yes' && steps.gate.outputs.key != ''
        env:
          KEY: ${{ steps.gate.outputs.key }}
        run: python3 scripts/claim.py "$KEY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 >/dev/null
        if: steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
      - run: pip install -q -r requirements.txt
        if: steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
      - name: Fetch fonts (OFL) if missing
        if: steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/NotoSansDevanagari.ttf ] || curl -sSL -o assets/fonts/NotoSansDevanagari.ttf "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf"
          [ -f assets/fonts/NotoSans.ttf ] || curl -sSL -o assets/fonts/NotoSans.ttf "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf"
      - name: Run pipeline
        if: steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLOT: ${{ github.event.inputs.slot }}
          SLOT_KEY: ${{ steps.gate.outputs.key }}
          SLOT_TIME: ${{ steps.gate.outputs.time }}
          SLOT_KIND: ${{ steps.gate.outputs.kind }}
          BREAKING: ${{ steps.gate.outputs.breaking }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: python -m pipeline.main
      - name: Save state
        if: always() && steps.go.outputs.run == 'yes' && steps.claim.outputs.claimed != 'no'
        run: |
          python3 scripts/save_state.py "post $(date -u +%FT%TZ)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always() && steps.go.outputs.run == 'yes'
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*/reel.mp4
            out/*/caption.txt
          retention-days: 7
          if-no-files-found: ignore
